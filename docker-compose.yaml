services:
  notes-app:
    build:
      context: .
      dockerfile: Dockerfile
    image: notes-app:local
    ports:
      - '3000:3000'
    environment:
      NODE_ENV: production
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'wget', '--spider', '-q', 'http://127.0.0.1:3000/']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
